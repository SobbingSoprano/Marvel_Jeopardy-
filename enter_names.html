<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Player Names</title>
    <link rel="icon" href="data:,">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Monoton&family=Six+Caps&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="marvel.css">
    
    <!-- Preload Audio (high priority) -->
    <link rel="preload" href="Assets/Sounds/krakoa-match.mp3" as="audio" type="audio/mpeg">
    
    <!-- Preloader Script -->
    <script src="preloader.js"></script>
    <script src="page-transitions.js"></script>
    <script src="visual-effects.js"></script>
    
    <!-- Audio Manager -->
    <script src="audio-manager.js"></script>
    
    <!-- Security Utilities -->
    <script src="security.js"></script>
    
    <!-- Game Logic -->
    <script src="questions.js"></script>
    <script src="ai-sbmm.js"></script>
    <script src="community-training.js"></script>
</head>

<body class="game-page">

    <!-- CSS Preloader -->
    <div class="preloader preloader-gamepage">
        <div class="preloader-logo">
            <span class="preloader-marvel">MARVEL</span>
            <span class="preloader-jeopardy">Jeopardy!</span>
        </div>
        <div class="preloader-spinner"></div>
        <div class="preloader-loading-text">Assembling the Avengers...</div>
        <div class="preloader-disclaimer">This is a fan-made parody. Not affiliated with or endorsed by Disney or Marvel.</div>
    </div>

    <!-- Audio Placeholders -->

    <audio id="hover-sfx" preload="auto">
        <source src="Assets/Sounds/click.wav" type="audio/wav">
    </audio>

    <!-- Title -->
    <div class="title">
        <a href="index.html" class="title-wrapper" data-transition>
            <span class="title-marvel">MARVEL</span>
            <span class="title-jeopardy">Jeopardy!</span>
        </a>
    </div>

    <!-- Page Navigation -->
    <div class="page-nav">
        <a href="index.html" class="nav-btn" data-transition>Back to Home</a>
    </div>

    <div class="name-entry-container">
        <div class="name-entry-card">
            <h2 class="name-entry-title">Enter Player Names</h2>
            <p class="name-entry-sub" id="mode-display">Mode: 2 Players</p>

            <form id="nameForm" class="name-form">
                <div id="name-fields"></div>
                <button type="submit" class="submit-btn start-btn">
                    Start Game
                </button>
            </form>

        </div>
    </div>

    <script>
        // Get player count from URL
        const urlParams = new URLSearchParams(window.location.search);
        let playerCount = parseInt(urlParams.get('players')) || 2;
        
        // Validate player count
        if (playerCount < 2 || playerCount > 4) {
            window.location.href = 'index.html';
        }
        
        // Update mode display
        document.getElementById('mode-display').textContent = 
            `Mode: ${playerCount} Player${playerCount > 1 ? 's' : ''}`;
        
        // Generate name input fields
        const nameFieldsContainer = document.getElementById('name-fields');
        for (let i = 1; i <= playerCount; i++) {
            const fieldDiv = document.createElement('div');
            fieldDiv.className = 'name-field';
            fieldDiv.innerHTML = `
                <label for="player${i}_name">Player ${i} Name:</label>
                <input type="text" 
                       id="player${i}_name" 
                       name="player${i}_name" 
                       placeholder="Enter name..." 
                       required>
            `;
            nameFieldsContainer.appendChild(fieldDiv);
        }
        
        // Handle form submission
        document.getElementById('nameForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validate all names before proceeding
            let hasError = false;
            for (let i = 1; i <= playerCount; i++) {
                const input = document.getElementById(`player${i}_name`);
                const validation = Security.validateName(input.value);
                if (!validation.valid && input.value.trim().length > 0) {
                    hasError = true;
                    input.setCustomValidity(validation.message);
                    input.reportValidity();
                    input.classList.add('input-error');
                    return; // Stop submission
                }
            }
            
            // Initialize game state
            GameState.init(playerCount);
            
            // Collect and sanitize names
            const names = {};
            for (let i = 1; i <= playerCount; i++) {
                const input = document.getElementById(`player${i}_name`);
                names[i] = Security.sanitizeName(input.value) || `Player ${i}`;
            }
            
            // Save names to game state
            GameState.setPlayerNames(names);
            
            // Reset AI-SBMM so every new game starts at difficulty 1
            if (typeof AISBMM !== 'undefined') AISBMM.resetForNewGame();

            // Navigate with audio fade and transition
            PageTransitions.navigateTo(`${playerCount}P.html`);
        });
        
        // Start playing match music when page loads
        AudioManager.play('match');
    </script>

</body>

</html>
