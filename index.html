<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marvel Jeopardy!</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Monoton&family=Six+Caps&display=swap"
        rel="stylesheet"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="marvel.css" />
</head>

<body>
    <!-- CSS Preloader -->
    <div class="preloader preloader-homepage">
        <div class="preloader-logo">
            <span class="preloader-marvel">MARVEL</span>
            <span class="preloader-jeopardy">Jeopardy!</span>
        </div>
        <div class="preloader-spinner"></div>
    </div>

    <!-- Video Background -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip1.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip2.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip3.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip4.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip5.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip6.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip7.mp4" type="video/mp4" />
        </video>
        <video autoplay muted loop playsinline>
            <source src="Assets/Videos/Clip8.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- Title -->
    <div class="title">
        <div class="title-wrapper">
            <span class="title-marvel">MARVEL</span>
            <span class="title-jeopardy">Jeopardy<span class="exclamation">!</span></span>
        </div>
    </div>

    <!-- Player Selection -->
    <div class="container">

        <!-- 2 Players -->
        <div class="player-option" onclick="window.location.href='enter_names.html?players=2'">
            <div class="player-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 48 48" fill="#ff0000">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 48 48" fill="#ff0000">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
            </div>
            <p class="player-number">2P</p>
        </div>

        <!-- 3 Players -->
        <div class="player-option" onclick="window.location.href='enter_names.html?players=3'">
            <div class="player-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
            </div>
            <p class="player-number">3P</p>
        </div>

        <!-- 4 Players -->
        <div class="player-option" onclick="window.location.href='enter_names.html?players=4'">
            <div class="player-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ff0000" viewBox="0 0 48 48">
                    <circle cx="24" cy="18" r="12" />
                    <rect x="8" y="32" width="32" height="12" rx="6" />
                </svg>
            </div>
            <p class="player-number">4P</p>
        </div>

        <!-- Online Multiplayer -->
        <div class="player-option online-option" onclick="window.location.href='lobby.html'">
            <div class="player-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#00ff00" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <p class="player-number">ONLINE</p>
        </div>
    </div>

    <!-- Audio Player -->
    <audio controls loop autoplay class="audio-player">
        <source src="Assets/Sounds/krakoa-menu-theme.wav" type="audio/wav" />
        Your browser does not support the audio element.
    </audio>
</body>
</html>
