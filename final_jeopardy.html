<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Jeopardy!</title>
    <link rel="icon" href="data:,">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bungee&family=Monoton&family=Six+Caps&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="marvel.css">
    
    <!-- Preload Audio (high priority) -->
    <link rel="preload" href="Assets/Sounds/krakoa-overtime.mp3" as="audio" type="audio/mpeg">
    
    <!-- Preloader Script -->
    <script src="preloader.js"></script>
    <script src="page-transitions.js"></script>
    <script src="visual-effects.js"></script>
    
    <!-- Audio Manager -->
    <script src="audio-manager.js"></script>
    
    <!-- Security Utilities -->
    <script src="security.js"></script>
    
    <!-- Firebase SDK (Community Training match submission) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- Game Logic -->
    <script src="firebase-config.js"></script>
    <script src="questions.js"></script>
    <script src="ai-sbmm.js"></script>
    <script src="community-training.js"></script>
</head>

<body class="game-page">

    <!-- CSS Preloader -->
    <div class="preloader preloader-gamepage">
        <div class="preloader-logo">
            <span class="preloader-marvel">MARVEL</span>
            <span class="preloader-jeopardy">Jeopardy!</span>
        </div>
        <div class="preloader-spinner"></div>
        <div class="preloader-loading-text">Assembling the Avengers...</div>
        <div class="preloader-disclaimer">This is a fan-made parody. Not affiliated with or endorsed by Disney or Marvel.</div>
    </div>

    <!-- Audio Placeholders -->

    <audio id="hover-sfx" preload="auto">
        <source src="Assets/Sounds/click.wav" type="audio/mpeg">
    </audio>

<div class="title">
    <a href="index.html" class="title-wrapper" data-transition>
        <span class="title-marvel">MARVEL</span>
        <span class="title-jeopardy">Jeopardy!</span>
    </a>
</div>

<!-- Page Navigation -->
<div class="page-nav">
    <a href="index.html" class="nav-btn" id="leaveGameBtn" data-transition>Leave Game</a>
</div>

<!-- WAGER SCREEN -->
<div class="question-overlay" id="wagerScreen" style="display: none;">
    <div class="question-card">
        <h2 class="guess-title">FINAL JEOPARDY WAGER</h2>
        <p class="guess-instructions">How much will each player wager?</p>

        <form id="wagerForm" class="question-form">
            <div id="wagerFields"></div>
            <button type="submit" class="submit-btn">Submit Wagers</button>
        </form>
    </div>
</div>

<!-- QUESTION SCREEN -->
<div class="question-overlay" id="questionScreen" style="display: none;">
    <div class="question-card">
        <h2 class="guess-title">FINAL JEOPARDY QUESTION</h2>

        <div class="question-text" id="finalQuestionText"></div>

        <form id="answerForm" class="question-form">
            <div id="answerFields"></div>
            <p id="lockInStatus" style="text-align:center;color:#d4af37;font-family:'Anton',sans-serif;margin-top:10px;"></p>
        </form>
    </div>
</div>

<!-- RESULTS SCREEN -->
<div class="question-overlay" id="resultsScreen" style="display: none;">
    <div class="question-card">
        <h2 class="guess-title">Final Results</h2>
        
        <div id="resultsContent"></div>

        <h2 class="guess-title">Winner:</h2>
        <div class="question-text" id="winnerDisplay" style="font-size: 2em; color: #00ff00;"></div>

        <a href="index.html" class="submit-btn" id="returnBtn" style="margin-top: 20px;" data-transition>Return to Main Menu</a>
    </div>
</div>

<script>
    // Check if game state exists
    let gameState = GameState.load();
    if (!gameState || !gameState.playerNames || !gameState.playerScores) {
        PageTransitions.navigateTo('index.html');
    }

    // Initialize final jeopardy state
    let fjState = FinalJeopardy.load();
    if (!fjState) {
        fjState = FinalJeopardy.init();
    }

    const playerCount = gameState.playerCount;
    const playerNames = gameState.playerNames;
    const playerScores = gameState.playerScores;

    // Tracks which local players have locked in their Final Jeopardy answers
    let lockedAnswers = {};

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        AudioManager.play('overtime');
        renderStage();
    });

    function renderStage() {
        fjState = FinalJeopardy.load();
        
        // Hide all screens
        document.getElementById('wagerScreen').style.display = 'none';
        document.getElementById('questionScreen').style.display = 'none';
        document.getElementById('resultsScreen').style.display = 'none';

        if (fjState.stage === 'wager') {
            showWagerScreen();
        } else if (fjState.stage === 'question') {
            showQuestionScreen();
        } else if (fjState.stage === 'results') {
            showResultsScreen();
        }
    }

    function showWagerScreen() {
        const container = document.getElementById('wagerFields');
        container.innerHTML = '';

        // Party-game rule: everyone can wager up to the highest score in the game
        const maxWager = Math.max(...Object.values(playerScores), 0);

        for (let i = 1; i <= playerCount; i++) {
            const div = document.createElement('div');
            div.innerHTML = `
                <label class="question-label">
                    ${escapeHtml(playerNames[i])} (Score: $${playerScores[i]})
                </label>
                <input type="number" 
                       min="0" 
                       max="${maxWager}"
                       id="wager_${i}"
                       required 
                       class="question-input"
                       value="0">
            `;
            container.appendChild(div);
        }

        document.getElementById('wagerScreen').style.display = 'flex';
    }

    function showQuestionScreen() {
        document.getElementById('finalQuestionText').textContent = finalJeopardyQuestion.question;

        const container = document.getElementById('answerFields');
        container.innerHTML = '';
        lockedAnswers = {};
        updateLockInStatus();

        for (let i = 1; i <= playerCount; i++) {
            const div = document.createElement('div');
            div.className = 'fj-player-answer';
            div.style.marginBottom = '16px';
            div.dataset.player = i;
            div.innerHTML = `
                <label class="question-label">${escapeHtml(playerNames[i])}'s Answer:</label>
                <div class="fj-input-row" style="display:flex;gap:8px;align-items:center;">
                    <input type="password" id="answer_${i}" class="question-input" placeholder="e.g., What is Adamantium?" required style="flex:1;">
                    <button type="button" class="toggle-answer-btn" data-target="answer_${i}" style="padding:6px 10px;font-size:12px;cursor:pointer;background:#333;color:#fff;border:1px solid #555;border-radius:4px;white-space:nowrap;">👁 Show</button>
                    <button type="button" class="lock-in-btn" data-player="${i}" style="padding:6px 14px;font-size:12px;cursor:pointer;background:#d4af37;color:#000;border:1px solid #d4af37;border-radius:4px;font-weight:bold;white-space:nowrap;">🔒 Lock In</button>
                </div>
            `;
            container.appendChild(div);
        }

        // Attach show/hide toggles
        container.querySelectorAll('.toggle-answer-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = document.getElementById(this.dataset.target);
                if (!input || input.disabled) return;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = '🙈 Hide';
                } else {
                    input.type = 'password';
                    this.textContent = '👁 Show';
                }
            });
        });

        // Attach lock-in handlers (click + Enter key)
        container.querySelectorAll('.lock-in-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                lockInAnswer(parseInt(this.dataset.player));
            });
        });

        container.querySelectorAll('input[id^="answer_"]').forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const playerNum = parseInt(this.id.replace('answer_', ''));
                    lockInAnswer(playerNum);
                }
            });
        });

        document.getElementById('questionScreen').style.display = 'flex';
    }

    function lockInAnswer(playerNum) {
        const input = document.getElementById(`answer_${playerNum}`);
        if (!input || input.disabled) return;

        const answer = input.value.trim();
        if (!answer) {
            input.style.borderColor = '#ff0000';
            setTimeout(() => { input.style.borderColor = ''; }, 500);
            return;
        }

        lockedAnswers[playerNum] = answer;
        input.disabled = true;

        // Replace the input row with a locked indicator
        const row = input.closest('.fj-input-row');
        if (row) {
            row.innerHTML = `
                <div style="flex:1;padding:0.7em;border:2px solid #00ff00;border-radius:8px;background:#001100;color:#00ff00;font-family:'Anton',sans-serif;font-size:1.3em;text-align:center;">
                    🔒 ${escapeHtml(playerNames[playerNum])} LOCKED IN
                </div>
            `;
        }

        updateLockInStatus();

        // If everyone has locked in, auto-submit
        if (Object.keys(lockedAnswers).length === playerCount) {
            FinalJeopardy.submitAnswers(lockedAnswers);
            renderStage();
        }
    }

    function updateLockInStatus() {
        const lockedCount = Object.keys(lockedAnswers).length;
        const statusEl = document.getElementById('lockInStatus');
        if (statusEl) {
            if (lockedCount === 0) {
                statusEl.textContent = 'Each player: type your answer, then press Enter or click Lock In';
            } else if (lockedCount < playerCount) {
                statusEl.textContent = `${lockedCount} of ${playerCount} locked in — waiting for others...`;
            } else {
                statusEl.textContent = 'All players locked in! Revealing results...';
            }
        }
    }

    function showResultsScreen() {
        gameState = GameState.load();
        fjState = FinalJeopardy.load();
        
        const container = document.getElementById('resultsContent');
        container.innerHTML = '';

        const finalScores = gameState.playerScores;
        const answers = fjState.answers;
        const results = fjState.results;

        for (let i = 1; i <= playerCount; i++) {
            const resultColor = results[i] ? '#00ff00' : '#ff0000';
            const resultText = results[i] ? 'Correct' : 'Incorrect';
            
            const div = document.createElement('div');
            div.className = 'feedback-answer';
            div.style.marginBottom = '20px';
            div.innerHTML = `
                <p><strong>${escapeHtml(playerNames[i])}:</strong></p>
                <p>Your Answer: ${escapeHtml(answers[i])}</p>
                <p>Result: <span style="color:${resultColor};">${resultText}</span></p>
                <p>Final Score: $${finalScores[i]}</p>
            `;
            container.appendChild(div);
        }

        // Determine winner(s)
        const maxScore = Math.max(...Object.values(finalScores));
        const winners = [];
        for (let i = 1; i <= playerCount; i++) {
            if (finalScores[i] === maxScore) {
                winners.push(playerNames[i]);
            }
        }

        document.getElementById('winnerDisplay').textContent = winners.join(' & ');
        document.getElementById('resultsScreen').style.display = 'flex';

        // Submit anonymised match data to the Community Training pool
        if (typeof CommTraining !== 'undefined') CommTraining.submitMatchData();

        // Dramatic flash on results reveal
        ScreenEffects.flash('white');
    }

    // Wager form submission
    document.getElementById('wagerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const wagers = {};
        const maxWager = Math.max(...Object.values(playerScores), 0);
        for (let i = 1; i <= playerCount; i++) {
            const wagerInput = document.getElementById(`wager_${i}`);
            const validation = Security.validateWager(wagerInput.value, 0, maxWager, playerScores[i]);
            wagers[i] = validation.value;
        }

        FinalJeopardy.submitWagers(wagers);
        renderStage();
    });

    // Answer form submission — prevent default so Enter only locks the
    // focused player's answer instead of submitting the whole form.
    document.getElementById('answerForm').addEventListener('submit', function(e) {
        e.preventDefault();
    });

    // Return button - clear game state
    document.getElementById('returnBtn').addEventListener('click', function(e) {
        GameState.clear();
        FinalJeopardy.clear();
    });

    // Leave game button
    document.getElementById('leaveGameBtn').addEventListener('click', function(e) {
        e.preventDefault();
        if (confirm('Are you sure you want to leave the game?')) {
            GameState.clear();
            FinalJeopardy.clear();
            PageTransitions.navigateTo('index.html');
        }
    });

    // Helper function to escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
